# Mi Diabetes: base de datos, migraciones, recolector, API y túnel.
#
#   cd despliegue
#   copy .env.example .env      (y rellénalo)
#   docker compose up -d --build
#
# Para probar sin datos reales (Nightscout simulado):
#   docker compose --profile simulado up -d --build
#   (y en .env: NIGHTSCOUT_URL=http://nightscout-simulado:1337, NIGHTSCOUT_TOKEN=prueba-lectura)
#
# Túnel de Cloudflare (cuando esté configurado):
#   docker compose --profile tunel up -d
#
# Recolector de la pluma (LibreView), cuando esté confirmado:
#   docker compose --profile pluma up -d

name: mi-diabetes

x-app: &app
  build: ..
  image: mi-diabetes:local
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  depends_on:
    migraciones:
      condition: service_completed_successfully

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - datos_bd:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PUERTO_BD_LOCAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migraciones:
    build: ..
    image: mi-diabetes:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "comun.migrar"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  recolector:
    <<: *app
    command: ["python", "-m", "servicios.recoleccion", "servicio"]

  # Dosis de la pluma desde la web de LibreView → base → Nightscout. Con perfil propio:
  #   docker compose --profile pluma up -d
  # El código del SMS se escribe en la app; el "dispositivo de confianza" queda en el volumen.
  recolector-pluma:
    <<: *app
    profiles: ["pluma"]
    command: ["python", "-m", "servicios.recoleccion.pluma_cli", "servicio"]
    volumes:
      - sesion-libreview:/datos/libreview

  # Comidas por foto o texto: analiza con Ollama (nativo en Windows, con la GPU) lo que deja la API.
  comidas:
    <<: *app
    command: ["python", "-m", "servicios.comidas.trabajador", "servicio"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      RUTA_ALIMENTOS_USDA: /datos/alimentos/alimentos.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - fotos-comidas:/datos/fotos:ro
      - alimentos:/datos/alimentos:ro

  preparar-usda:          # una vez: docker compose --profile herramientas run --rm preparar-usda
    <<: *app
    profiles: ["herramientas"]
    restart: "no"
    command: ["python", "-m", "servicios.comidas.descargar_usda"]
    environment:
      RUTA_ALIMENTOS_USDA: /datos/alimentos/alimentos.sqlite
    volumes:
      - alimentos:/datos/alimentos

  # Fase 4: detecta anomalías y avisa por ntfy (servicios/anomalias). Ver ntfy/README.md.
  anomalias:
    <<: *app
    command: ["python", "-m", "servicios.anomalias", "servicio"]

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    restart: unless-stopped
    command: ["serve"]
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-datos:/var/lib/ntfy       # usuarios, tokens y la caché de 24 h (no contiene secretos del repo)

  api:
    <<: *app
    volumes:
      - fotos-comidas:/datos/fotos
    ports:
      - "127.0.0.1:${PUERTO_API_LOCAL:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nightscout-simulado:
    profiles: ["simulado"]
    build: ..
    image: mi-diabetes:local
    environment:
      NS_TOKEN: prueba-lectura
      NS_DIAS: "30"
      NS_EN_VIVO: "1"
    command: ["python", "-m", "herramientas.nightscout_simulado"]
    ports:
      - "127.0.0.1:1338:1337"

  cloudflared:
    profiles: ["tunel"]
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
      - ntfy

volumes:
  datos_bd:
  sesion-libreview:
  fotos-comidas:     # fotos de las comidas: datos de salud, solo en el PC (entran en la copia restic, restic/copia.ps1)
  ntfy-datos:
  alimentos:         # base USDA en SQLite (servicios/comidas/preparar_bd.py), opcional
